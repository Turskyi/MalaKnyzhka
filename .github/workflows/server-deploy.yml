name: Deploy Server to Cloud Run

on:
  push:
    branches:
      - master
    paths:
      - 'server/**'
      - 'Dockerfile'
      - '.github/workflows/server-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Server Distribution
        run: ./gradlew :server:installDist --no-daemon

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and Push Container
        run: |-
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/mala-knyzhka-server .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/mala-knyzhka-server

      - name: Deploy to Cloud Run
        run: |-
          gcloud run deploy mala-knyzhka-server \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/mala-knyzhka-server \
            --region northamerica-northeast1 \
            --platform managed \
            --allow-unauthenticated
